name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Must be macOS: the app is macOS-only, sharp resolves a darwin-arm64
    # prebuild, and Electron cannot run headless here — the e2e step needs a
    # real WindowServer session, which GitHub's macOS runners provide.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build renderer and main
        run: npm run build

      - name: End-to-end tests
        # packaged.spec.ts skips itself when no bundle exists, so this covers
        # the dev-mode specs only. The packaged bundle is tested in release.yml.
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
