<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E97FF"/>
      <stop offset="100%" stop-color="#0060DF"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle tile: 840/1024 (~82%) of canvas, centered, transparent padding around it -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#tile)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#sheen)"/>

  <!-- Two overlapping forms at opposing rotations: one shape turning into another -->
  <rect x="280" y="280" width="380" height="380" rx="72"
        fill="#0B3C78" transform="rotate(-13 470 470)"/>
  <rect x="365" y="365" width="380" height="380" rx="72"
        fill="#FFFFFF" transform="rotate(15 555 555)"/>
</svg>
